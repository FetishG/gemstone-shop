<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemstone Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }
        header img {
            max-height: 80px;
            vertical-align: middle;
        }
        .container {
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            color: #666;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .stone-card {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stone-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        .stone-card h3 {
            font-size: 1em;
            margin: 10px 0 5px 0;
        }
    </style>
</head>
<body>

    <header>
        <img src="Gem_Fetish/logo.png" alt="Gemstone Shop Logo">
        <h2>Welcome to Our Gemstone Collection</h2>
    </header>

    <div class="container">
        <h1>Exquisite Gemstone Beads</h1>
        <p>Explore our premium collection of stones crafted for your creations.</p>

        <div class="gallery">
            <div class="stone-card">
                <img src="Gem_Fetish/angelite-10mm.jpg" alt="Angelite">
                <h3>Angelite (10mm)</h3>
            </div>
            <div class="stone-card">
                <img src="Gem_Fetish/amethyst-10mm.jpg" alt="Amethyst">
                <h3>Amethyst (10mm)</h3>
            </div>
            <div class="stone-card">
                <img src="Gem_Fetish/aquamarine-10mm.jpg" alt="Aquamarine">
                <h3>Aquamarine (10mm)</h3>
            </div>
            <div class="stone-card">
                <img src="Gem_Fetish/citrine-10mm.jpg" alt="Citrine">
                <h3>Citrine (10mm)</h3>
            </div>
        </div>
    </div>

</body>
</html>
